<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signing in — InkoopMatch</title>
  <!--
    MSAL v5 redirect bridge. The Google sign-in popup lands here and
    this page hands the result back to the main window, then closes.
    Deliberately a static file, not an app route. Must never be served
    with a Cross-Origin-Opener-Policy header.
  -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Manrope", "Avenir Next", Avenir, "Segoe UI", sans-serif;
      color: #102f46;
      background: #f7f3eb;
    }
  </style>
</head>
<body>
  <p>Signing you in…</p>
  <script src="/msal-redirect-bridge.min.js"></script>
  <script>
    msalRedirectBridge.broadcastResponseToMainFrame().catch(function (err) {
      console.error("[auth] redirect bridailed", err);
    });
  </script>
</body>
</html>
